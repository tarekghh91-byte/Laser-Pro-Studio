name: Windows app (test build)

on:
  workflow_dispatch:
  push:
    branches: [main, "design/**"]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'lib/**'
      - 'pubspec.yaml'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --project-name laser_pro_studio --platforms=windows .
      - name: Remove generated counter test
        run: Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build premium Windows app
        run: flutter build windows --release -t lib/main_premium.dart
      - name: Zip entire Windows distribution
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          if (!(Test-Path $source)) { throw "Windows release build directory missing" }
          Compress-Archive -Path "$source/*" -DestinationPath "Laser-Studio-Pro-Premium-Windows-TEST.zip"
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LaserStudioPro-Premium-Windows-TEST
          path: Laser-Studio-Pro-Premium-Windows-TEST.zip
          retention-days: 14
          if-no-files-found: error
