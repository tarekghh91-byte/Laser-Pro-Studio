name: Android Small APK (test)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-light.yml'
      - 'lib/**'
      - 'pubspec.yaml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-android-light.yml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'test/**'

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android app
        run: flutter create --org com.laserpro.woodcuts --project-name laser_pro_studio --platforms=android .
      - name: Enable network access and remove generated counter test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('android/app/src/main/AndroidManifest.xml')
          s=f.read_text()
          assert '<application' in s
          s=s.replace('android:label="laser_pro_studio"', 'android:label="Laser Pro Wood Test"')
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
              f.write_text(s)
          Path('test/widget_test.dart').unlink(missing_ok=True)
          PY
      - name: Flutter dependencies
        run: flutter pub get
      - name: Verify safe SharedPreferences Android dependency
        run: |
          flutter pub deps --style=compact | tee /tmp/flutter-deps.txt
          grep -F 'shared_preferences_android 2.4.28' /tmp/flutter-deps.txt
          grep -q 'shared_preferences_android:' pubspec.lock
      - name: Check compilation
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test inventory modal lifecycle
        run: flutter test test/inventory_dialog_test.dart test/bootstrap_test.dart test/wood_boards_test.dart test/wood_inventory_ui_test.dart
      - name: Build compact ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK is a zip archive
        run: |
          unzip -t build/app/outputs/flutter-apk/app-release.apk > /dev/null
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Save small APK
        uses: actions/upload-artifact@v4
        with:
          name: LaserProStudio-Android-ARM64-WOOD-TEST
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
