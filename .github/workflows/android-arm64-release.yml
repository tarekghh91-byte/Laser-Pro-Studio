name: Android ARM64 Release Candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-arm64-release.yml'
  push:
    branches:
      - design/black-gold-workspace
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-arm64-release.yml'

permissions:
  contents: read

jobs:
  android-arm64-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --project-name laser_pro_studio --platforms=android .
      - name: Remove generated counter test
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build ARM64 release candidate
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          unzip -t build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Upload ARM64 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: LASER-STUDIO-PRO-Android-ARM64-RC
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
