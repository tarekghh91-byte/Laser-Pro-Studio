<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0c"><title>LASER STUDIO PRO</title>
<style>
:root{--bg:#090a0c;--panel:#141619;--panel2:#1d2024;--text:#fff;--muted:#b7bdc5;--gold:#c9a34a;--line:#343a40;--good:#5fc99a;--bad:#ff7777;--warn:#e9bd62;--radius:15px;--shadow:0 8px 30px #0007;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px #c9a34a22}textarea{min-height:75px;resize:vertical}
button.primary{background:var(--gold);color:#111;border:0;border-radius:10px;padding:11px 16px;font-weight:800}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px}button.danger{background:#351b1b;color:#ffb0aa;border:1px solid #743d3d;border-radius:10px;padding:10px 14px}button.ghost{background:transparent;color:var(--muted);border:0;padding:9px}
small,.muted{color:var(--muted)}.small{font-size:12px}.money{font-variant-numeric:tabular-nums;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}
#shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#111315;border-left:1px solid var(--line);padding:18px 13px}.brand{display:grid;justify-items:center;margin:0 auto 14px}.brand img{width:126px;height:126px;object-fit:contain}.brand-caption{display:grid;text-align:center;line-height:1.35;margin-top:-4px}.brand-caption strong{color:var(--gold);letter-spacing:2px;font-size:13px}.brand-caption b{color:#fff;letter-spacing:4px;font-size:13px}.nav{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;margin:3px 0;border:1px solid transparent;background:transparent;color:#e9e9e9;text-align:right;border-radius:10px}.nav:hover,.nav.active{background:var(--panel2);border-color:#54472b;color:var(--gold)}.nav .ico{width:22px;text-align:center;color:var(--gold)}
main{min-width:0;padding:25px clamp(14px,3vw,34px) 70px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.topbar h1{font-size:25px;margin:0}.top-actions{display:flex;align-items:center;gap:9px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:100px;color:var(--muted);font-size:12px;white-space:nowrap}.pill.gold{color:var(--gold);border-color:#75602e}.pill.good{color:var(--good);border-color:#2f7357}.pill.bad{color:var(--bad);border-color:#7d3a3a}.pill.warn{color:var(--warn);border-color:#755d2c}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:25px;color:var(--gold);font-weight:850;margin-top:7px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 12px}.section-head h2{font-size:19px;margin:0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.stack{display:grid;gap:10px}.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.item h3{margin:0 0 7px;font-size:16px}.item p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.7}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input{max-width:300px}.empty{padding:24px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:13px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:block;font-size:13px;color:var(--muted)}.field span{display:block;margin:0 0 6px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px;padding:9px 0;color:var(--text)}.check input{width:auto;accent-color:var(--gold)}.hint{background:#201d16;border:1px solid #5b4a29;color:#d8c99e;padding:11px 13px;border-radius:10px;font-size:12px;line-height:1.7;margin:10px 0}.divider{height:1px;background:var(--line);margin:14px 0}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;place-items:center;padding:12px}#modal.show{display:grid}.dialog{width:min(760px,100%);max-height:94dvh;overflow:auto;background:var(--panel);border:1px solid #5a4a2a;border-radius:18px;padding:19px;box-shadow:var(--shadow)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialog-head h2{margin:0;font-size:20px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.consume-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(90px,1fr) auto;gap:8px;margin:8px 0}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.login{width:min(430px,100%);padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.login-logo{display:grid;justify-items:center;margin-bottom:12px}.login-logo img{width:140px;height:140px;object-fit:contain}.login h1{font-size:22px;margin:0 0 5px;text-align:center}.login p{text-align:center;font-size:13px;color:var(--muted);line-height:1.7}.login .field{margin:13px 0}.toast{position:fixed;bottom:18px;left:18px;z-index:90;background:var(--panel2);border:1px solid var(--gold);border-radius:11px;padding:12px 16px;box-shadow:var(--shadow);max-width:min(420px,90vw)}.hidden{display:none}
@media(max-width:900px){#shell{display:block}.sidebar{position:sticky;z-index:5;top:0;height:auto;padding:8px 10px 7px;border-left:0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;justify-content:flex-start;gap:9px;margin:0 4px 7px}.brand img{width:55px;height:55px}.brand-caption{margin:0;text-align:right}.navs{display:flex;overflow-x:auto;gap:4px;white-space:nowrap}.nav{width:auto;flex:0 0 auto;padding:9px 11px;font-size:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}main{padding:16px 12px 60px}.topbar h1{font-size:21px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.consume-row{grid-template-columns:1fr 100px auto}}
@media(max-width:380px){.metric{font-size:20px}.card{padding:12px}.nav{padding:8px 9px}}
</style>
</head>

const $=id=>document.getElementById(id);
const n=v=>Number(v||0);
const money=v=>"$"+n(v).toFixed(2);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const state={user:null,page:"home",data:{},settings:{}};
const TABLES=["orders","customers","product_types","materials","payments","expenses","capital_setup_records","designs","product_material_requirements","order_consumptions","inventory_movements","app_settings","design_folders","order_attachments","order_invoices"];
function rows(name){return state.data[name]||[]}
function one(name,id){return rows(name).find(x=>x.id===id)}
function paid(id){return rows("payments").filter(x=>x.order_id===id).reduce((s,x)=>s+n(x.amount),0)}
function remaining(o){return Math.max(0,n(o.agreed_price)-paid(o.id))}
function isHanded(o){return !!o.handed_over||o.handoff_status==="handed_over"}
function paymentLabel(o){const p=paid(o.id);if(p<=0)return "لم يدفع";if(p+0.005<n(o.agreed_price))return "مدفوع جزئياً";return "مدفوع بالكامل"}
function productionLabel(o){return o.status==="ready"?"جاهز للاستلام":o.status==="cancelled"?"ملغي":"قيد التنفيذ"}
function toast(msg,bad){const t=$("toast");t.className="toast";t.style.borderColor=bad?"#a94343":"var(--gold)";t.textContent=msg;setTimeout(()=>{t.className="";t.textContent=""},4000)}
function btn(text,action,kind){return '<button type="button" class="'+(kind||"secondary")+'" data-action="'+esc(action)+'">'+text+'</button>'}
function field(name,label,type,value,extra){return '<label class="field"><span>'+label+'</span><input name="'+name+'" type="'+(type||"text")+'" value="'+esc(value??"")+'" '+(extra||"")+'></label>'}
function selectField(name,label,options,value){return '<label class="field"><span>'+label+'</span><select name="'+name+'">'+options.map(x=>'<option value="'+esc(x[0])+'" '+(String(x[0])===String(value??"")?"selected":"")+'>'+esc(x[1])+'</option>').join("")+'</select></label>'}
function textarea(name,label,value){return '<label class="field wide"><span>'+label+'</span><textarea name="'+name+'">'+esc(value||"")+'</textarea></label>'}
function nav(){return [["home","⌂","الرئيسية"],["orders","▤","الطلبات"],["products","◇","المنتجات"],["materials","▦","المواد والمخزون"],["customers","♙","الزبائن"],["accounting","＄","المحاسبة"],["reports","▥","التقارير"],["expenses","−","المصاريف"],["capital","＋","رأس المال"],["designs","▧","التصاميم"],["settings","⚙","الإعدادات"]]}
function authScreen(){
$("root").innerHTML='<div class="login-wrap"><div class="login"><div class="login-logo"><img src="'+LOGO+'" alt="Laser Pro"></div><h1>LASER STUDIO PRO</h1><p>سجّل الدخول بالحساب المرتبط ببياناتك الحالية حتى تظهر طلباتك السابقة ومخزونك. لا تنشئ حساباً جديداً حتى لا تفتح قاعدة فارغة.</p><form id="authForm">'+field("email","البريد الإلكتروني","email","","required autocomplete=email")+field("password","كلمة المرور","password","","required autocomplete=current-password")+'<button class="primary" style="width:100%;margin-top:10px">تسجيل الدخول</button></form></div></div>';
$("authForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await SB.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(r.error)throw r.error;toast("تم تسجيل الدخول.")}catch(x){toast(x.message||String(x),true)}}
}
async function loadData(){
const out={};
for(const name of TABLES){const {data,error}=await SB.from(name).select("*").limit(2000);if(error){if(name==="order_attachments"||name==="order_invoices"||name==="design_folders"){out[name]=[];continue}throw error}out[name]=data||[]}
state.data=out;
const s=rows("app_settings").find(x=>x.owner_id===state.user.id);
state.settings=Object.assign({business_name:"LASER STUDIO PRO",currency_code:"USD",wood_thickness_mm:3,laser_type:"diode",cutting_software:"LightBurn",brand_accent_color:"#C9A34A"},s||{});
}
let realtimeChannel=null,reloadTimer=null;
function subscribeRealtime(){
if(realtimeChannel)SB.removeChannel(realtimeChannel);
let channel=SB.channel("laser-studio-pro-"+state.user.id);
["orders","customers","product_types","materials","payments","expenses","capital_setup_records","designs","product_material_requirements","order_consumptions","inventory_movements","order_attachments","order_invoices","app_settings","design_folders"].forEach(table=>{
channel=channel.on("postgres_changes",{event:"*",schema:"public",table:table,filter:"owner_id=eq."+state.user.id},()=>scheduleReload());
});
realtimeChannel=channel.subscribe();
}
function scheduleReload(){
if(reloadTimer)return;
reloadTimer=setTimeout(async()=>{reloadTimer=null;if(!state.user)return;try{await loadData();render()}catch(e){toast(e.message||String(e),true)}},650);
}

function updateReports(){
const period=$("reportRange")?.value||"month",now=new Date();
let start=null;
if(period==="day")start=today();
if(period==="month")start=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-01";
if(period==="year")start=now.getFullYear()+"-01-01";
const inRange=d=>!start||String(d||"").slice(0,10)>=start;
const sales=rows("orders").filter(o=>isHanded(o)&&inRange(o.handed_over_at||o.delivered_at||o.order_date));
const revenue=sales.reduce((s,o)=>s+n(o.agreed_price),0);
const cost=sales.reduce((s,o)=>s+(o.finalized_at?n(o.calculated_material_cost_snapshot):n(o.estimated_unit_cost_snapshot)*n(o.quantity||1)),0);
const received=rows("payments").filter(p=>inRange(p.payment_date)).reduce((s,p)=>s+n(p.amount),0);
const expenses=rows("expenses").filter(x=>inRange(x.expense_date)).reduce((s,x)=>s+n(x.amount),0);
const receivable=sales.reduce((s,o)=>s+remaining(o),0);
const products={};sales.forEach(o=>{const k=o.product_name_snapshot||"منتج خاص";products[k]=(products[k]||0)+n(o.quantity||1)});
const top=Object.entries(products).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>'<div class="line-row">'+esc(x[0])+' <b style="float:left">'+x[1]+' قطعة</b></div>').join("")||'<p class="muted">لا توجد مبيعات في الفترة.</p>';
$("reportResults").innerHTML='<div class="cards">'+metric("المبيعات بعد التسليم",money(revenue))+metric("المقبوض خلال الفترة",money(received))+metric("المصاريف",money(expenses))+metric("الربح الصافي",money(revenue-cost-expenses))+'</div><div class="grid2"><div class="card"><h3>ملخص الفترة</h3><p>طلبات تم تسليمها: <b>'+sales.length+'</b></p><p>تكلفة مواد الطلبات المسلّمة: <b>'+money(cost)+'</b></p><p>مستحقات هذه الطلبات: <b>'+money(receivable)+'</b></p></div><div class="card"><h3>الأكثر مبيعاً</h3>'+top+'</div></div>';
}

const body='<p>المتوفر حالياً: <b>'+n(m.current_stock)+' '+esc(m.unit)+'</b> · متوسط تكلفة الوحدة: <b>'+money(m.average_unit_cost)+'</b></p>'+field("quantity","الكمية المشتراة","number","1",'min=".001" step=".001" required')+field("total_cost","إجمالي تكلفة الشراء ($)","number","0",'min="0" step=".01" required')+textarea("note","اسم المورد أو ملاحظات الشراء");
openModal("شراء مخزون: "+esc(m.name),body,async f=>{
const r=await SB.rpc("receive_material_purchase",{p_material_id:id,p_quantity:n(f.get("quantity")),p_total_cost:n(f.get("total_cost")),p_note:String(f.get("note")||"")});if(r.error)throw r.error;
toast("تمت إضافة الكمية. متوسط تكلفة الوحدة الجديد "+money(r.data.average_unit_cost));
});
}
function newProduct(id){
const p=id?one("product_types",id):null;
const body='<div class="fields">'+field("name","اسم المنتج","text",p?.name||"","required")+
selectField("category","التصنيف",[["person_figurine","مجسم شخص"],["profession_figurine","مجسم مهنة"],["hobby_figurine","مجسم هواية"],["wooden_frame","ستاند خشب"],["keychain","ميدالية"],["other","أخرى"]],p?.category||"other")+
field("size_label","المقاس / الوصف","text",p?.size_label||"")+
field("sale_price","سعر البيع الافتراضي ($)","number",p?.sale_price||0,'min="0" step=".01"')+
field("estimated_cost","التكلفة التقديرية ($)","number",p?.estimated_cost||0,'min="0" step=".01"')+
field("default_width_cm","العرض الافتراضي (سم)","number",p?.default_width_cm||"",'min="0" step=".1"')+
field("default_height_cm","الارتفاع الافتراضي (سم)","number",p?.default_height_cm||"",'min="0" step=".1"')+
field("base_height_cm","ارتفاع القاعدة (سم)","number",p?.base_height_cm||0,'min="0" step=".1"')+
'<label class="check"><input type="checkbox" name="has_base_default" '+(p?.has_base_default?"checked":"")+'> مع قاعدة افتراضياً</label><label class="check"><input type="checkbox" name="has_background_default" '+(p?.has_background_default?"checked":"")+'> مع خلفية افتراضياً</label>'+
'<label class="field wide"><span>صورة المنتج</span><input type="file" name="product_image" accept="image/*"></label></div>';
openModal(p?"تعديل المنتج":"منتج جديد",body,async f=>{
const data={owner_id:state.user.id,name:String(f.get("name")||"").trim(),category:f.get("category"),size_label:f.get("size_label"),sale_price:n(f.get("sale_price")),estimated_cost:n(f.get("estimated_cost")),default_width_cm:n(f.get("default_width_cm"))||null,default_height_cm:n(f.get("default_height_cm"))||null,base_height_cm:n(f.get("base_height_cm")),has_base_default:f.get("has_base_default")==="on",has_background_default:f.get("has_background_default")==="on"};
let productId=p?.id;
if(p){const r=await SB.from("product_types").update(data).eq("id",p.id).select("id").single();if(r.error)throw r.error;productId=r.data.id}
else{const r=await SB.from("product_types").insert(data).select("id").single();if(r.error)throw r.error;productId=r.data.id}
const imageFile=f.get("product_image");
if(imageFile&&imageFile.size>0){
const safe=imageFile.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=state.user.id+"/products/"+productId+"/"+Date.now()+"-"+safe;
const up=await SB.storage.from("laser-pro-files").upload(path,imageFile,{upsert:false,contentType:imageFile.type||"application/octet-stream"});if(up.error)throw up.error;
const u=await SB.from("product_types").update({image_path:path}).eq("id",productId);if(u.error)throw u.error;
if(p?.image_path)await SB.storage.from("laser-pro-files").remove([p.image_path]);
}
},p?"حفظ التعديل":"حفظ المنتج");
}
async function openProductImage(id){
const p=one("product_types",id);if(!p?.image_path)return;
const win=window.open("about:blank","_blank");
const {data,error}=await SB.storage.from("laser-pro-files").createSignedUrl(p.image_path,600);
if(error){if(win)win.close();throw error}
if(win)win.location.href=data.signedUrl;else toast("اسمح بفتح نافذة جديدة لعرض الصورة.",true);
}
function newMaterial(id){
const m=id?one("materials",id):null;
const body='<div class="fields">'+field("name","اسم المادة","text",m?.name||"","required")+
selectField("category","التصنيف",[["wood","خشب"],["packaging","تغليف"],["consumable","مواد استهلاكية"],["other","أخرى"]],m?.category||"wood")+
field("unit","وحدة القياس","text",m?.unit||"قطعة","required")+
field("stock",m?"الرصيد الحالي (للعرض فقط)":"الرصيد الافتتاحي","number",m?.current_stock||0,m?'readonly':'min="0" step=".001"')+
field("cost","متوسط تكلفة الوحدة ($)","number",m?.average_unit_cost||0,'min="0" step=".0001"')+
field("reorder","حد التنبيه","number",m?.reorder_level||0,'min="0" step=".001"')+
selectField("costing_mode","طريقة حساب التكلفة",[["unit","حسب الوحدة"],["area","حسب المساحة"]],m?.costing_mode||"unit")+'</div>'+(m?'<div class="hint">تغيير كمية المخزون يتم من زر «شراء / إضافة مخزون» أو من استهلاك الطلبات، حتى يبقى سجل الحركة دقيقاً.</div>':"");
openModal(m?"تعديل المادة":"مادة جديدة",body,async f=>{
const stock=n(f.get("stock")),data={owner_id:state.user.id,name:String(f.get("name")||"").trim(),category:f.get("category"),unit:String(f.get("unit")||"قطعة"),average_unit_cost:n(f.get("cost")),reorder_level:n(f.get("reorder")),costing_mode:f.get("costing_mode"),is_active:true};
if(m){const r=await SB.from("materials").update(data).eq("id",m.id);if(r.error)throw r.error}
else{data.current_stock=stock;const r=await SB.from("materials").insert(data).select("id").single();if(r.error)throw r.error;if(stock>0){const mv=await SB.from("inventory_movements").insert({owner_id:state.user.id,material_id:r.data.id,movement_type:"opening",quantity_delta:stock,unit_cost:n(f.get("cost")),note:"رصيد افتتاحي"});if(mv.error)throw mv.error}}
});
}
function newCustomer(id){
const c=id?one("customers",id):null;
const body='<div class="fields">'+field("full_name","اسم الزبون","text",c?.full_name||"","required")+field("phone","رقم الهاتف","tel",c?.phone||"")+field("address","العنوان","text",c?.address||"")+textarea("notes","ملاحظات")+'</div>';
openModal(c?"تعديل الزبون":"زبون جديد",body,async f=>{
const data={owner_id:state.user.id,full_name:String(f.get("full_name")||"").trim(),phone:String(f.get("phone")||""),address:String(f.get("address")||""),notes:String(f.get("notes")||"")};
const r=c?await SB.from("customers").update(data).eq("id",c.id):await SB.from("customers").insert(data);if(r.error)throw r.error;
});
}
function newExpense(){
const body='<div class="fields">'+field("title","اسم المصروف","text","","required")+selectField("category","التصنيف",[["electricity","كهرباء"],["maintenance","تصليح وصيانة"],["rent","إيجار"],["subscription","اشتراكات"],["shipping","توصيل"],["marketing","تسويق"],["other","أخرى"]],"other")+field("amount","المبلغ ($)","number","0",'min=".01" step=".01" required')+field("expense_date","التاريخ","date",today())+textarea("notes","ملاحظات")+'</div>';
openModal("تسجيل مصروف",body,async f=>{const r=await SB.from("expenses").insert({owner_id:state.user.id,title:f.get("title"),category:f.get("category"),amount:n(f.get("amount")),expense_date:f.get("expense_date")||today(),notes:f.get("notes")});if(r.error)throw r.error});
}
function newCapital(){
const body='<div class="fields">'+field("item_name","اسم بند التأسيس","text","","required")+selectField("record_type","نوع السجل",[["purchase","شراء معدات"],["stock","مخزون تأسيسي"],["expense","تجهيزات ومصاريف تأسيس"]],"purchase")+field("category","التصنيف","text","معدات")+field("quantity","الكمية","number","1",'min=".001" step=".001"')+field("unit","الوحدة","text","قطعة")+field("unit_cost","تكلفة الوحدة ($)","number","0",'min="0" step=".01"')+field("paid_amount","المبلغ المدفوع ($)","number","0",'min="0" step=".01"')+field("record_date","التاريخ","date",today())+textarea("notes","ملاحظات")+'</div>';
openModal("رأس المال والتأسيس",body,async f=>{const q=n(f.get("quantity")),u=n(f.get("unit_cost"));const r=await SB.from("capital_setup_records").insert({owner_id:state.user.id,record_type:f.get("record_type"),record_date:f.get("record_date")||today(),item_name:f.get("item_name"),category:f.get("category"),quantity:q,unit:f.get("unit"),unit_cost:u,total_amount:q*u,paid_amount:n(f.get("paid_amount")),notes:f.get("notes"),excluded_from_calculations:true});if(r.error)throw r.error});
}
function newFolder(){
openModal("مجلد تصاميم جديد",field("name","اسم المجلد","text","","required"),async f=>{
const r=await SB.from("design_folders").insert({owner_id:state.user.id,name:String(f.get("name")||"").trim(),sort_order:rows("design_folders").length});if(r.error)throw r.error;
});
}
function newDesign(id){
const d=id?one("designs",id):null;
const folders=[["","بدون مجلد"],...rows("design_folders").map(f=>[f.id,f.name])];
const body='<div class="fields">'+field("title","اسم التصميم","text",d?.title||"","required")+
field("product_category","التصنيف","text",d?.product_category||"مجسمات")+
selectField("folder_id","مجلد التصميم",folders,d?.folder_id||"")+
field("width_cm","العرض (سم)","number",d?.width_cm||"",'min="0" step=".1"')+
field("height_cm","الارتفاع (سم)","number",d?.height_cm||"",'min="0" step=".1"')+
field("material_thickness_mm","سماكة الخشب (mm)","number",d?.material_thickness_mm||3,'min=".1" step=".1"')+
field("estimated_material_cost","التكلفة التقديرية ($)","number",d?.estimated_material_cost||0,'min="0" step=".01"')+
field("suggested_sale_price","سعر البيع المقترح ($)","number",d?.suggested_sale_price||0,'min="0" step=".01"')+
selectField("design_status","حالة التصميم",[["concept","فكرة"],["in_progress","قيد العمل"],["ready_for_cut","جاهز للقص"],["archived","مؤرشف"]],d?.design_status||"concept")+
textarea("description","الوصف وملاحظات التجميع",d?.description||"")+
'<label class="field"><span>صورة المعاينة</span><input type="file" name="preview_file" accept="image/*"></label>'+
'<label class="field"><span>ملف القص SVG / DXF / ZIP</span><input type="file" name="cut_file" accept=".svg,.dxf,.zip"></label>'+
'<label class="field"><span>ملف الحفر</span><input type="file" name="engraving_file" accept=".svg,.dxf,.png,.pdf"></label>'+
'</div><div class="hint">الملفات تحفظ داخل مكتبة التصميم بشكل خاص، ولا تظهر إلا لحسابك.</div>';
openModal(d?"تعديل التصميم وملفاته":"إضافة تصميم",body,async f=>{
const data={owner_id:state.user.id,title:String(f.get("title")||"").trim(),product_category:f.get("product_category"),description:f.get("description"),width_cm:n(f.get("width_cm"))||null,height_cm:n(f.get("height_cm"))||null,material_thickness_mm:n(f.get("material_thickness_mm"))||3,estimated_material_cost:n(f.get("estimated_material_cost")),suggested_sale_price:n(f.get("suggested_sale_price")),design_status:f.get("design_status"),library_source:"user",folder_id:f.get("folder_id")||null};
let idValue=d?.id;
if(d){const r=await SB.from("designs").update(data).eq("id",d.id).select("id").single();if(r.error)throw r.error;idValue=r.data.id}
else{const r=await SB.from("designs").insert(data).select("id").single();if(r.error)throw r.error;idValue=r.data.id}
const patch={};
for(const pair of [["preview_file","preview_path"],["cut_file","cut_file_path"],["engraving_file","engraving_file_path"]]){
const file=f.get(pair[0]);if(file&&file.size>0){
const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
const path=state.user.id+"/designs/"+idValue+"/"+Date.now()+"-"+safe;
const mime=file.type||"application/octet-stream";
const up=await SB.storage.from("laser-pro-files").upload(path,file,{upsert:false,contentType:mime});if(up.error)throw up.error;
patch[pair[1]]=path;
}
}
if(Object.keys(patch).length){const r=await SB.from("designs").update(patch).eq("id",idValue);if(r.error)throw r.error}
});
}
async function openDesignFile(id,column){
const d=one("designs",id);if(!d||!d[column])return;
const win=window.open("about:blank","_blank");
const {data,error}=await SB.storage.from("laser-pro-files").createSignedUrl(d[column],600);
if(error){if(win)win.close();throw error}
if(win)win.location.href=data.signedUrl;else toast("اسمح بفتح نافذة جديدة لعرض الملف.",true);
}
async function saveSettings(){
const f=$("settingsForm");const d=new FormData(f);
const row={owner_id:state.user.id,business_name:d.get("business_name"),currency_code:d.get("currency_code"),locale:"ar",wood_thickness_mm:n(d.get("wood_thickness_mm")),laser_type:d.get("laser_type"),cutting_software:d.get("cutting_software"),brand_accent_color:"#C9A34A",updated_at:new Date().toISOString()};
const r=await SB.from("app_settings").upsert(row,{onConflict:"owner_id"});if(r.error)throw r.error;await loadData();render();toast("تم حفظ الإعدادات");
}
async function handleAction(a){
try{
if(a==="refresh"){await loadData();render();return}
if(a==="new-order")return newOrder();
if(a==="new-product")return newProduct();
if(a.startsWith("product-materials:"))return productMaterials(a.split(":")[1]);
if(a.startsWith("receive-material:"))return receiveMaterial(a.split(":")[1]);
if(a.startsWith("edit-product:"))return newProduct(a.split(":")[1]);
if(a.startsWith("open-product-image:"))return openProductImage(a.split(":")[1]);
if(a==="new-material")return newMaterial();
if(a.startsWith("edit-material:"))return newMaterial(a.split(":")[1]);
if(a==="new-customer")return newCustomer();
if(a.startsWith("edit-customer:"))return newCustomer(a.split(":")[1]);
if(a.startsWith("customer-statement:"))return customerStatement(a.split(":")[1]);
if(a.startsWith("delete-customer:")){const id=a.split(":")[1];if(rows("orders").some(o=>o.customer_id===id))throw Error("لا يمكن حذف زبون لديه طلبات مرتبطة.");if(!confirm("حذف هذا الزبون؟"))return;const r=await SB.from("customers").delete().eq("id",id);if(r.error)throw r.error;await loadData();render();toast("تم حذف الزبون");return}
if(a.startsWith("delete-product:")){const id=a.split(":")[1];if(rows("orders").some(o=>o.product_type_id===id)||rows("product_material_requirements").some(x=>x.product_type_id===id))throw Error("هذا المنتج مرتبط بطلبات أو بمواد تصنيع. استخدم تعطيل المنتج.");if(!confirm("حذف المنتج؟"))return;const r=await SB.from("product_types").delete().eq("id",id);if(r.error)throw r.error;await loadData();render();toast("تم حذف المنتج");return}
if(a.startsWith("deactivate-product:")){const id=a.split(":")[1];const r=await SB.from("product_types").update({is_active:false}).eq("id",id);if(r.error)throw r.error;await loadData();render();toast("تم تعطيل المنتج دون حذف سجله");return}
if(a.startsWith("delete-material:")){const id=a.split(":")[1];if(rows("order_consumptions").some(x=>x.material_id===id)||rows("product_material_requirements").some(x=>x.material_id===id)||rows("inventory_movements").some(x=>x.material_id===id))throw Error("هذه المادة مرتبطة بحركات أو تصنيع. استخدم إيقاف المادة.");if(!confirm("حذف المادة؟"))return;const r=await SB.from("materials").delete().eq("id",id);if(r.error)throw r.error;await loadData();render();toast("تم حذف المادة");return}
if(a.startsWith("deactivate-material:")){const id=a.split(":")[1];const r=await SB.from("materials").update({is_active:false}).eq("id",id);if(r.error)throw r.error;await loadData();render();toast("تم إيقاف المادة دون حذف سجلها");return}
if(a==="new-expense")return newExpense();
if(a==="new-capital")return newCapital();
if(a==="new-design")return newDesign();
if(a==="new-folder")return newFolder();
if(a.startsWith("edit-design:"))return newDesign(a.split(":")[1]);
if(a.startsWith("open-design-file:")){const parts=a.split(":");return openDesignFile(parts[1],parts[2])}
if(a.startsWith("view-order:"))return orderDetails(a.split(":")[1]);
if(a.startsWith("open-file:"))return openAttachment(a.split(":")[1]);
if(a.startsWith("delete-file:"))return deleteAttachment(a.split(":")[1]);
if(a.startsWith("edit-order:"))return editOrder(a.split(":")[1]);
if(a.startsWith("ready:"))return readyOrder(a.split(":")[1]);
if(a.startsWith("handoff:"))return handoffOrder(a.split(":")[1]);
if(a.startsWith("payment:"))return paymentOrder(a.split(":")[1]);
if(a.startsWith("invoice:"))return invoiceOrder(a.split(":")[1]);
if(a.startsWith("delete-order:")){const id=a.split(":")[1];if(!confirm("هل تريد حذف الطلب؟ ستُعاد المواد إلى المخزون وتُحذف دفعاته وملفاته."))return;const files=rows("order_attachments").filter(x=>x.order_id===id);const r=await SB.rpc("delete_order_with_reversal",{p_order_id:id});if(r.error)throw r.error;if(files.length){const rm=await SB.storage.from("laser-pro-files").remove(files.map(x=>x.storage_path));if(rm.error)toast("حُذف الطلب، لكن تعذّر حذف بعض الملفات من التخزين.",true)}await loadData();render();toast("تم حذف الطلب وعكس حركة المخزون")}
if(a.startsWith("go:")){state.page=a.split(":")[1];render();return}
if(a==="save-settings")return saveSettings();
if(a==="logout"){await stopRealtime();await SB.auth.signOut();state.user=null;authScreen(false);return}
}catch(e){toast(e.message||String(e),true)}
}
document.addEventListener("click",e=>{
const p=e.target.closest("[data-page]");if(p){state.page=p.dataset.page;render();return}
const a=e.target.closest("[data-action]");if(a)handleAction(a.dataset.action);
});
(async()=>{
try{
const {data,error}=await Promise.race([
SB.auth.getSession(),
new Promise((_,reject)=>setTimeout(()=>reject(new Error("انتهت مهلة الاتصال أثناء تهيئة النظام. تحقق من الإنترنت ثم أعد تحميل الصفحة.")),12000))
]);
if(error)throw error;
state.user=data.session?.user||null;
if(state.user){try{await loadData();render();subscribeRealtime()}catch(e){toast(e.message||String(e),true);authScreen(false)}}else authScreen(false);
SB.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_IN"){state.user=session.user;try{await loadData();render();subscribeRealtime()}catch(e){toast(e.message||String(e),true);authScreen(false)}}if(event==="SIGNED_OUT"){await stopRealtime();state.user=null;authScreen(false)}});
}catch(e){authScreen(false);toast("تعذر بدء النظام: "+(e.message||String(e)),true)}
})();
  })();
})();
</script>
</body></html>
