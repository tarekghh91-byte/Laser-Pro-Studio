name: laser_pro_studio
description: Laser Pro Studio - Windows and Android order manager starter
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  supabase_flutter: ^2.18.3
